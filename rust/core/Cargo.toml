[package]
name = "translatecore"
version = "0.1.0"
edition = "2021"
description = "Native translation pipeline core (VAD/ASR/MT/TTS orchestration). PoC stage."

[lib]
name = "translatecore"
# cdylib: loaded by the Android app via JNA. staticlib kept for future iOS/desktop linking.
crate-type = ["cdylib", "staticlib"]

# uniffi-bindgen binary lives in this crate so bindings are generated from the
# exact same uniffi version the library was built with (avoids version drift).
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"

# llama.cpp is cross-compiled with CMake, so it is Android-only: host builds
# (cargo test, uniffi-bindgen) must not need CMake or a C++ toolchain.
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["android-static-stdcxx"] }
# Direct dependency only for llama_print_system_info(); keep it pinned to the
# version llama-cpp-2 resolves to.
llama-cpp-sys-2 = { version = "=0.1.159", default-features = false }

# cmake-rs derives CMAKE_BUILD_TYPE from the package's opt-level. Without this, a
# debug build of the core would contain an unoptimized ggml.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
