name: Release build

# Builds a signed release APK. Triggered by pushing a version tag (e.g. v0.2.0),
# or manually via the Actions tab. On a tag, the APK is attached to a GitHub
# Release; manual runs just upload it as a workflow artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the GitHub Release on a tag

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the trailing
      # comment records the human-readable tag each SHA was resolved from.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true # gradle-wrapper.jar is stored via Git LFS (see .gitattributes)

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust/core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # llama.cpp is built by CMake with the Ninja generator (rust/core/.cargo/config.toml).
      # Printing the versions here fails early if a tool is missing.
      - name: Check CMake and Ninja
        run: |
          command -v ninja >/dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }
          cmake --version
          ninja --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          YAKUMO_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          YAKUMO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          YAKUMO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          YAKUMO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Stage APK
        id: apk
        run: |
          src=android/app/build/outputs/apk/release/app-release.apk
          name="yakumo-${GITHUB_REF_NAME}.apk"
          cp "$src" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yakumo-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.apk.outputs.path }}
